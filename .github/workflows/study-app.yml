name: Study Space · build and deploy
on:
  push:
    branches: [master]
    paths:
      [
        "app/**",
        "scripts/build-study-data.py",
        "scripts/copy-legacy.mjs",
        "scripts/finalize-build.mjs",
        ".github/workflows/study-app.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: study-space-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm run test --prefix app
      - run: npm run build --prefix app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Study Space
        id: deployment
        uses: actions/deploy-pages@v4
